<style>
    html{

linear-gradient(

}

html{

    overflow:hidden;

    height:100%;
}

body{

    background:#000000;

    color:white;

    font-family:Arial,sans-serif;

    text-align:center;

    margin:0;

    padding:35px 10px 20px 10px;

    min-height:100vh;

    overflow:hidden;
}

#homeScreen{

    position:fixed;

    inset:0;

    overflow:hidden;
}

.date{

    font-family:
    'Cormorant Garamond',
    serif;

    color:#D4AF37;

    font-size:42px;

    font-weight:500;

    letter-spacing:3px;

    white-space:nowrap;

    margin-top:20px;

    margin-bottom:10px;

    text-shadow:
        0 0 12px rgba(212,175,55,.20);
}

.date::after{

    content:"";

    position:absolute;

    left:50%;

    top:50%;

    width:300px;

    height:80px;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(
        rgba(212,175,55,.15),
        transparent
    );

    filter:blur(20px);

    z-index:-1;
}

.card{

    width:95vw;

    max-width:none;

    margin:5px auto;

    padding:0;

    overflow:hidden;

    border-radius:34px;

    cursor:pointer;

    transition:.35s ease;
}

.card + .card{

    margin-top:-10px;<div id="messageScreen">
}





.card:hover{

    transform:
    translateY(-10px)
    scale(1.02);
}
.card img{
    width:100%;
    display:block;
    border-radius:34px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

    filter:
        drop-shadow(
            0 0 25px rgba(212,175,55,.20)
        );

    transition:.4s ease;
}

.card img:hover{
    transform:scale(1.015);
}
.card img:hover{
    transform:scale(1.015);
}

    width:100%;

    display:block;

    border-radius:34px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}
.card:hover{transform:translateY(-6px) scale(1.02)}
.heartCard{background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(220,220,220,.85));color:#111}
.hotCard{background:linear-gradient(145deg,#5b0000,#b50016,#ff1738)}
.ouchCard{
    background:none;
    border:none;
}
.title{font-size:52px;font-weight:700}.subtitle{font-size:24px}.heartCard .title,.heartCard .subtitle{color:#111}.hotCard .title,.hotCard .subtitle,.ouchCard .title,.ouchCard .subtitle{color:white}
#messageScreen{

    display:none;

    position:relative;

    min-height:100vh;

    background-size:cover;

    background-position:center 15%;

    background-repeat:no-repeat;

    background-attachment:fixed;
}
#fixedBackground{

    position:fixed;

    top:-100px;

    left:0;

    width:100vw;

    height:calc(100vh + 100px);

    z-index:0;

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}



.bigTitle{

    display:none;
}

.message{

    width:80vw;

    max-width:600px;

    margin:auto;

    text-align:center;
}

#cardImage img{

    width:96vw;

    max-width:720px;

    max-height:420px;

    object-fit:cover;

    border-radius:36px;

    margin:20px 0;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.gold-divider{

    color:#D4AF37;

    font-size:18px;

    margin-bottom:20px;

    opacity:.8;

    text-shadow:
        0 0 10px rgba(212,175,55,.45);
}

.message-container{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;
}

#cardImage img{

    width:100%;

    max-width:650px;

    max-height:420px;

    object-fit:cover;

    border-radius:36px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);

    margin-bottom:25px;
}

.message-panel{

    max-width:700px;

    padding:0 20px;
}

.bigTitle{

    color:#D4AF37;

    font-size:58px;

    letter-spacing:3px;

    margin-bottom:10px;

    text-shadow:
        0 0 20px rgba(212,175,55,.40);
}

.message{

    font-size:30px;

    line-height:1.8;

    color:#f5f5f5;

    max-width:650px;

    margin:auto;

    padding:0 20px;
}

.share img{

    width:70px;

    height:auto;

    display:block;

    transition:.3s ease;

    position:relative;

top:18px;

}

.share img:hover{

    transform:scale(1.05);
}

.share:hover{

    transform:scale(1.08);
}


.backButton{

    font-size:58px;

    font-weight:400;

    color:#D4AF37;

    cursor:pointer;

    text-shadow:
        -2px 0 #000,
         2px 0 #000,
         0 -2px #000,
         0 2px #000;
}

.backButton:hover{

    opacity:1;

    transform:scale(1.15);
}
#messageScreen{

    display:none;

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:5;
}

#messageScreen::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.10),
        rgba(0,0,0,.65)
    );

    z-index:1;
}

.message-overlay{

    position:fixed;

    inset:0;

    z-index:2;

    overflow:hidden;
}

.message-topbar{

    position:fixed;

    top:-15px;

    left:10px;

    right:10px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    z-index:9999;
}

    font-size:42px;

    font-weight:900;

    color:#D4AF37;

    cursor:pointer;

    text-shadow:none;
}

.share{

    font-size:100px;

    cursor:pointer;

    text-shadow:none;
}

html,
body{

    scrollbar-width:none;

    -ms-overflow-style:none;
}

::-webkit-scrollbar{

    display:none;
}

.fade-out{

    opacity:0;

    transform:scale(.98);

    transition:.5s ease;
}

.fade-in{

    opacity:1;

    transform:scale(1);

    transition:.8s ease;
}

.fade-in{

    opacity:1;

    transform:scale(1);

    transition:.8s ease;
}

.fade-out{

    opacity:0;

    transform:scale(.98);

    transition:.4s ease;
}

.message-scroll{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

}

}

<div id="homeScreen"><div class="date" id="todayDate"></div>

<div class="gold-divider">
    ✦
</div>



<div class="card heartCard">
  <img src="ui/card-heart.webp">
</div>

<div class="card hotCard">
  <img src="ui/card-hot.webp">
</div>

<div class="card ouchCard">
  <img src="ui/card-ouch.webp">
</div>
</div>
<div id="messageScreen">

    <div id="fixedBackground"></div>

    <div id="cardImage"></div>

<div class="message-topbar">

        <div class="backButton"
             onclick="goBack()">
            ←
        </div>

        <div class="share"
     onclick="sendMessage()">

    <img src="ui/envelope-heart.png"
         alt="Envoyer">

</div>
        </div>

    <div class="message-overlay">

    
<div class="message-scroll">

    <div id="cardTitle"
         class="bigTitle">
    </div>

    <div id="cardMessage"
         class="message">
    </div>

</div>

</div>

    </div>

    

</div>

</div>




    </div>

</div>

<script>
const d=new Date();const mois=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];document.getElementById('todayDate')
.innerHTML =

`<span class="dayNumber">
${d.getDate()}
</span>

<span class="monthName">
${mois[d.getMonth()]}
</span>`;

let contenu=null;fetch('calendrier_avent.json').then(r=>r.json()).then(data=>{const jour=d.getDate();contenu=data.find(i=>i.jour===jour)||data[0];document.querySelector('.heartCard').onclick=()=>
showMessage(
    '♡',
    contenu.coeur||'',
    contenu.coeurSms||'',
    contenu.coeurImage||''
);

document.querySelector('.hotCard').onclick=()=>
showMessage(
    'HOT',
    contenu.hot||'',
    contenu.hotSms||'',
    contenu.hotImage||''
);

document.querySelector('.ouchCard').onclick=()=>
showMessage(
    'OUCH!',
    contenu.ouch||'',
    contenu.ouchSms||'',
    contenu.ouchImage||''
);

});
let currentSms = "";
function showMessage(
    t,
    m,
    sms,
    i
){

    homeScreen.classList.add(
        "fade-out"
    );

    setTimeout(() => {

        homeScreen.style.display =
            "none";

        messageScreen.style.display =
            "block";

        messageScreen.classList.add(
            "fade-in"
        );

        cardTitle.innerText = t;

        cardMessage.innerText = m;

        currentSms = sms;

        document.getElementById(
            'fixedBackground'
        ).style.backgroundImage =
        `url('${i}')`;

    },400);
}

function goBack(){

    messageScreen.classList.add(
        "fade-out"
    );

    setTimeout(() => {

        messageScreen.style.display =
            "none";

        homeScreen.style.display =
            "block";

        homeScreen.classList.remove(
            "fade-out"
        );

        messageScreen.classList.remove(
            "fade-out"
        );

        homeScreen.classList.add(
            "fade-in"
        );

        setTimeout(() => {

            homeScreen.classList.remove(
                "fade-in"
            );

        },800);

    },400);
}

function sendMessage(){

    const txt =
        encodeURIComponent(
            currentSms
        );

    window.location.href =
        `sms:+33623474165?body=${txt}`;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
</script></body></html>
