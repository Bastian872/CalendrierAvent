<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Calendrier Avent Premium</title>
<style>
body{background:radial-gradient(circle at top,#1b1b1b 0%,#080808 40%,#000 100%);color:white;font-family:Arial,sans-serif;text-align:center;padding:padding:90px 20px 20px 20px;margin:0}
.date{

    color:#D4AF37;

    font-size:38px;

    font-weight:700;

    letter-spacing:6px;

    margin-top:50px;

    margin-bottom:10px;

    text-shadow:
        0 0 15px rgba(212,175,55,.35);
}

.card{

    width:95vw;

    max-width:none;

    margin:5px auto;

    padding:0;

    overflow:hidden;

    border-radius:34px;

    cursor:pointer;

    transition:.35s ease;
}

.card + .card{

    margin-top:-10px;<div id="messageScreen">
}





.card:hover{

    transform:
    translateY(-10px)
    scale(1.02);
}
.card img{
    width:100%;
    display:block;
    border-radius:34px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

    filter:
        drop-shadow(
            0 0 25px rgba(212,175,55,.20)
        );

    transition:.4s ease;
}

.card img:hover{
    transform:scale(1.015);
}
.card img:hover{
    transform:scale(1.015);
}

    width:100%;

    display:block;

    border-radius:34px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}
.card:hover{transform:translateY(-6px) scale(1.02)}
.heartCard{background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(220,220,220,.85));color:#111}
.hotCard{background:linear-gradient(145deg,#5b0000,#b50016,#ff1738)}
.ouchCard{
    background:none;
    border:none;
}
.title{font-size:52px;font-weight:700}.subtitle{font-size:24px}.heartCard .title,.heartCard .subtitle{color:#111}.hotCard .title,.hotCard .subtitle,.ouchCard .title,.ouchCard .subtitle{color:white}
#messageScreen{
    display:none;
}

.bigTitle{
    color:#D4AF37;
    font-size:62px;
}

.message{
    font-size:32px;
    line-height:1.8;
    color:#f5f5f5;
    max-width:650px;
    margin:auto;
}

#cardImage img{
    width:100%;

    max-width:480px;

    max-height:260px;

    object-fit:cover;

    border-radius:32px;

    margin:30px 0;
}

.gold-divider{

    color:#D4AF37;

    font-size:18px;

    margin-bottom:20px;

    opacity:.8;

    text-shadow:
        0 0 10px rgba(212,175,55,.45);
}

.message-container{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;
}

#cardImage img{

    width:100%;

    max-width:650px;

    max-height:420px;

    object-fit:cover;

    border-radius:36px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);

    margin-bottom:25px;
}

.message-panel{

    max-width:700px;

    padding:0 20px;
}

.bigTitle{

    color:#D4AF37;

    font-size:56px;

    font-weight:700;

    margin-bottom:10px;

    text-shadow:
        0 0 20px rgba(212,175,55,.4);
}

.message{

    color:white;

    font-size:30px;

    line-height:1.8;

    text-align:center;

    margin-bottom:40px;
}

.share{

    font-size:70px;

    cursor:pointer;

    transition:.3s;
}

.share:hover{

    transform:scale(1.08);
}


.backButton{

    margin-top:20px;

    color:#D4AF37;

    font-size:42px;

    font-weight:300;

    cursor:pointer;

    opacity:.7;

    transition:.3s ease;
}

.backButton:hover{

    opacity:1;

    transform:scale(1.15);
}

</style>
</head><body>
<div id="homeScreen"><div class="date" id="todayDate"></div>

<div class="gold-divider">
    ✦
</div>



<div class="card heartCard">
  <img src="ui/card-heart.webp">
</div>

<div class="card hotCard">
  <img src="ui/card-hot.webp">
</div>

<div class="card ouchCard">
  <img src="ui/card-ouch.webp">
</div>
</div>
<div id="messageScreen">

    <div class="message-container">

        <div id="cardImage"></div>

        <div class="message-panel">

            <div id="cardTitle"
                 class="bigTitle">
            </div>

            <div id="cardMessage"
                 class="message">
            </div>

        </div>

        <div class="share"
             onclick="sendMessage()">

            💌❤️

        </div>

<div class="backButton" onclick="goBack()">
    ←
</div>

    </div>

</div>

<script>
const d=new Date();const mois=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];document.getElementById('todayDate').innerText=d.getDate()+' '+mois[d.getMonth()];
let contenu=null;fetch('calendrier_avent.json').then(r=>r.json()).then(data=>{const jour=d.getDate();contenu=data.find(i=>i.jour===jour)||data[0];document.querySelector('.heartCard').onclick=()=>showMessage('♡',contenu.coeur||'',contenu.coeurImage||'');document.querySelector('.hotCard').onclick=()=>showMessage('HOT',contenu.hot||'',contenu.hotImage||'');document.querySelector('.ouchCard').onclick=()=>showMessage('OUCH!',contenu.ouch||'',contenu.ouchImage||'');});
function showMessage(t,m,i){homeScreen.style.display='none';messageScreen.style.display='block';cardTitle.innerText=t;cardMessage.innerText=m;cardImage.innerHTML=i?`<img src="${i}">`:'';}
function goBack(){messageScreen.style.display='none';homeScreen.style.display='block';}
function sendMessage(){const txt=encodeURIComponent(cardMessage.innerText);window.location.href=`sms:+33623474165?body=${txt}`;}
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
</script></body></html>
